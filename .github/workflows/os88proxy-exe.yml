# The Windows build of the reformatting proxy (docs/PROXY-PLAN.md 13).
#
# It exists because the proxy's audience includes a tester with an os8088 machine and no
# Python, and because a Windows binary cannot be built anywhere but on Windows
# - so it is built HERE, on a windows-latest runner, rather than by hand on
# somebody's desk where nobody else can reproduce it.
#
# Download it from the run's Artifacts, or from the release when a tag is
# pushed. It is UNSIGNED: SmartScreen will say so on first run, and
# docs/PROXY-PLAN.md 13.2 is what to tell the tester.
name: os88proxy.exe

on:
  push:
    paths:
      - 'tools/os88proxy.py'
      - 'tools/os88proxygui.py'
      - 'tools/htmsim.py'
      - '.github/workflows/os88proxy-exe.yml'
  workflow_dispatch:
  release:
    types: [published]
  # Called by os88proxy-release.yml on a `proxy-v*` tag, which is the only
  # thing that passes a tag in - the steps are identical either way, so the
  # binary a tester downloads from a release is the binary the branch's own
  # push built and checked.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The GATES run first, on the same interpreter that is about to be
      # frozen: an .exe of a build that does not pass its own checks is worse
      # than no .exe, because the tester is the one who finds out.
      - name: The engine's own gate
        run: python tools/os88proxy.py --selfcheck
      - name: The server, in the guest's wire format
        run: python tests/proxytest.py
      - name: The window
        run: python tests/proxyguitest.py

      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name os88proxy `
            --paths tools --hidden-import htmsim `
            tools/os88proxygui.py

      # A frozen app that cannot find htmsim still RUNS - it falls back to a
      # crude fold and says so on /about - so the bundle is asked directly
      # rather than trusted. It answers into a FILE, because a --noconsole
      # binary has no stdout attached when a console starts it.
      #
      # AND IT IS STARTED WITH -Wait, WHICH IS THE OTHER HALF OF THE SAME FACT:
      # a windowed binary does not block the shell that launched it either, so
      # the first version read the file two seconds before the .exe wrote it
      # and failed a build that was perfectly good. `& ...` returns at once;
      # Start-Process -Wait does not.
      - name: The bundle carries the fold table
        run: |
          $p = Start-Process -FilePath ".\dist\os88proxy.exe" `
                 -ArgumentList "--self-report", "report.json" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the .exe exited $($p.ExitCode)" }
          if (-not (Test-Path report.json)) {
            throw "the .exe ran and wrote no report - it did not reach main()"
          }
          $r = Get-Content report.json -Raw
          Write-Host $r
          if ($r -notmatch '"fold": "htmsim"') {
            throw "the .exe is not carrying tools/htmsim.py - the fold would be the crude one"
          }
          if ($r -notmatch '"frozen": true') { throw "that was not the frozen binary" }

      - uses: actions/upload-artifact@v4
        with:
          name: os88proxy-windows
          path: dist/os88proxy.exe
          if-no-files-found: error

      # A binary belongs in a RELEASE and not in the repository (CLAUDE.md:
      # nothing in build/ is tracked), and a release asset is also the only
      # link a tester can use without a GitHub account.
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            `os88proxy.exe` - the reformatting proxy for the os8088 browser,
            as one file. No Python, no installer.

            Windows will say it does not recognise it (it is unsigned):
            **More info -> Run anyway**. The first Start raises a firewall
            prompt - allow it on **private networks only**.

            docs/PROXY-PLAN.md 13 is what it is and how it was checked.
          files: dist/os88proxy.exe
          fail_on_unmatched_files: true
