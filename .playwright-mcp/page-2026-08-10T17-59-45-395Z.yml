      - generic [ref=e783]: v1.0.20260730.1
      - generic [ref=e787]:
        - heading "v1.0.20260730.1" [level=2] [ref=e788]
        - paragraph [ref=e789]:
          - text: Released 2026-07-30 from
          - code [ref=e790]: 84387fae8
