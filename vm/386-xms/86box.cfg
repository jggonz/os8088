; os8088 - the EXTENDED MEMORY machine (SPEC.md 41, 41.12.5)
;
; A 386DX with 4MB, which is the shape of the report that found 41.12.5: a
; BIOS claiming 3MB above 1MB and a Task Manager showing no XMS bar. It is
; vm/386dx with mem_size 2048 -> 4096 and nothing else, so a difference
; between the two is a difference about MEMORY and not about the machine.
;
; What to look at: Task Manager, then CLICK THE CONTENT ONCE to reach the
; Memory view - the XMS line and its bar are there and not on the process
; page. A working 4MB machine reads `CPU 386+   XMS   0/3008K`: 3,072KB
; reported less the 64KB the HMA takes (SPEC.md 2.4). `XMS 0/0K` with the
; layout shifted up one row means no store, which on a machine that has the
; RAM is a driver that did not attach.
;
; 86Box rewrites this file on exit, and it CLAMPS mem_size to the machine's
; own maximum - micronics386 takes 16MB, so 4096 survives.

[General]
confirm_exit = 0
confirm_reset = 0
confirm_save = 0
emu_build_num = 9001
scale = 2
uuid = 6d1f0a34-9c22-5a71-8e4b-1b7d5c02aa19
vid_renderer = qt_opengl3
video_fullscreen_scale = 0

[Machine]
cpu_family = i386dx
cpu_multi = 1
cpu_speed = 25000000
cpu_use_dynarec = 0
machine = micronics386
mem_size = 4096
pit_mode = 0

[Video]
gfxcard = oti067
video_fullscreen_scale_maximized = 1

[Input devices]
keyboard_type = keyboard_at
mouse_type = msserial

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
fdd_01_fn = ../../build/os8088.img
fdd_02_type = 35_2hd
fdd_02_fn = ../../build/apps.img
fdd_host_buffering = 1
