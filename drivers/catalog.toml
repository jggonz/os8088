# drivers/catalog.toml - what each loadable driver IS, in plain words.
#
# The wide Control Panel's Drivers page (SPEC.md 134.8) shows a category icon,
# a long name and a one- or two-line description for every driver. The kernel
# knows only a driver's file, title and class (drv_tab, SPEC.md 51), so the
# words live here, outside the kernel, and tools/cpwdat.py compiles them into
# CPWIDE.DAT (SPEC.md 134.7). Nothing here costs a resident byte.
#
# HOW TO ADD A DRIVER
#   1. Add its row to drv_tab (kernel/driver.inc) as usual.
#   2. Add ONE table below, named by the driver's 8.3 FILE, upper case, as the
#      drv_f_* label in kernel/driver.inc spells it:
#
#          ["NEWCARD.DRV"]
#          category    = "NET"        # DISP SOUND STOR NET INPUT MEM SYS UNK
#                                     # (a CWC_* of kernel/cpwfmt.inc)
#          icon        = "C_NET"      # a CWI16_* name of kernel/cpwfmt.inc, or
#                                     # the 0..31 index of a cell in
#                                     # kernel/cpwart/cp-icons-16.png
#          name        = "Acme Network Card"           # <= 25 characters
#          description = [                             # one or two lines,
#            "What it does, in a sentence.",           # each <= 46 characters
#            "What hardware it needs, if any.",
#          ]
#
#   3. `make` rebuilds build/cpwide.dat; tests/unit/t_cpwdat.py (fast tier)
#      fails the build for a drv_tab row with no entry here, an entry naming no
#      row, a line over its limit, or an icon outside the sheet.
#   Say what the driver does and what it needs, not how it works. A driver
#   with no entry still works: the page shows it with the Unknown icon, its
#   drv_tab title and no description.

["SOUND.DRV"]
category = "SOUND"
icon = "C_SND"
name = "Sound Cards"
description = [
  "Sound Blaster, AdLib and compatible cards:",
  "digital audio and FM music.",
]

