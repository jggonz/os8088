# --- SPEC.md 18.97's case: ONE drive, which is what the field 5150 has -------
# The probe exists because the int 11h equipment word is a CLAIM. MartyPC has
# no DIP override, so it derives the word from the drive list - which means
# this machine reports ONE and the probe correctly declines to run on it. That
# makes it the REGRESSION half of the test (an uncontested machine must be
# untouched); the ABSENT half is this machine with a scratch kernel whose
# count gate is forced, so that unit 1 is really not there when it is asked
# about. docs/TESTING.md has the recipe.
[[machine]]
name = "os8088_5150_cga_1fd"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_1_360k_floppy",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# ...and the one-drive overlay itself, which upstream does not carry: every
# stock profile is a two-floppy machine.
[[overlay]]
name = "pcxt_1_360k_floppy"
    [overlay.fdc]
    bus_type = "ISA"
    type = "IbmNec"
        [[overlay.fdc.drive]]
        type  = "360k"

# --- WHY THERE IS NO MONO-PRIMARY TWO-CARD MACHINE HERE ------------------
#
# The field 5150 boots on its HERCULES, because SW1-5/6 say 11b = 80x25 mono
# and vid_detect's last rung is int 11h bits 5:4 (SPEC.md 39.1). None of the
# two-card machines above does, and it CANNOT BE FIXED FROM THIS FILE:
# measured, os8088_5150_both_gla reports bits 5:4 = 0x20 (80x25 colour), and
# so does the same machine with the MDA listed FIRST - MartyPC derives the
# 5150's display switches from whether a CGA is in the config at all, not
# from card order, and exposes no DIP override. Listing the MDA first only
# moves MARTYPC's primary to it, which os8088 then does not drive (the DIP
# still says colour), so the boot gate watches a blank card and `launch`
# times out. os8088_5150_herc_gla reads 0x30 only because it has no CGA.
#
# The consequence is worth stating rather than rediscovering: SPEC.md
# 39.11.1's vid_cga_alias runs ONLY when the mono card is primary, and that
# is still exactly the direction no emulator here can produce - which is the
# same reason its bug survived in the first place. It is a 5150 question.

# --- the two-card 5150 WITH ITS DISPLAY SWITCHES SET THE WAY THE FIELD ONE'S
# --- ARE (SPEC.md 39.1, docs/FIELD-MACHINES.md)
#
# `video_dip` is OURS - patches/03 - and it exists because SW1-5/6 is a
# SETTING and not a description of what is installed. Upstream derives those
# bits from the card list ("any CGA present -> CGA hires"), which cannot
# express a machine that holds BOTH cards with the switches set to mono, and
# that is exactly the arrangement the calibration 5150 has: os8088 boots on
# its Hercules there and on the CGA in every emulated two-card machine.
#
# It is the direction that MATTERS rather than a curiosity: SPEC.md 39.11.1's
# vid_cga_alias runs ONLY when the mono card is primary, which is precisely
# why its bug survived - "the direction the old emulator could reproduce was
# CGA-primary, where the routine never runs". This machine reproduces it.
[[machine]]
name = "os8088_5150_both_gla_mono"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
video_dip = "mda"
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    # THE MDA IS LISTED FIRST, and that is about the HARNESS rather than the
    # guest: MartyPC's own primary card is the first in this list, `fbuf` and
    # the os88marty boot gate read the primary, and os8088 is driving the MDA
    # here - so with the CGA first the gate watches an unprogrammed card,
    # never sees a desktop, and `launch` times out on a machine that booted
    # perfectly. The DIP above is what decides which card the GUEST picks;
    # this order is what decides which one the TOOLING looks at, and on this
    # machine they have to agree.
    [[machine.video]]
    bus_type = "ISA"
    type = "MDA"
    subtype = "Hercules"
    clock_mode = "Dynamic"

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"
# ...and the machine SPEC.md 18.96.2's size override exists for: the field
# 5150's own 27 Oct 82 ROM with an 80-CYLINDER drive as B. That ROM answers no
# AH=08h for a floppy, so dskw_fmt_probe reads a 360KB machine and offers 360K
# for a disk that could hold 720K - which is exactly what the confirmation's
# Space key is for, and exactly what nothing here could exercise before.
#
# The floppy overlay is dropped rather than listed, because the drives ARE the
# point: upstream's pcxt_2_360k_floppies is two 360k drives and the FDC takes a
# maximum of four (its pcxt_4_360k_floppies is the other one worth knowing
# about). Drive 0 stays 360k so the boot is the shipped 360KB system disk.
[[machine]]
name = "os8088_5150_cga_720b"
type = "Ibm5150v256K"
rom_set = "ibm5150_82_v4"
speaker = true
overlays = [
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [machine.fdc]
    bus_type = "ISA"
    type = "IbmNec"

        [[machine.fdc.drive]]
        type = "360k"

        [[machine.fdc.drive]]
        type = "720k"

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# ...and the FOUR-drive 5150: two internal and the pair on the 5.25" adapter's
# external 37-pin connector (SPEC.md 18.97). Upstream's own overlay, because
# the FDC takes four and this is what four looks like. Drives 2 and 3 carry no
# image, which is the honest case - a drive that is present and empty, whose
# mount fails like any other (18.3).
#
# What it exists to answer is whether the equipment word can be believed: the
# 1982 ROM copies SW1 into 0040:0010 and its bits 6-7 are the drive COUNT, so
# this machine must report 4 where os8088_5150_cga reports 2.
[[machine]]
name = "os8088_5150_cga_4fdd"
type = "Ibm5150v256K"
rom_set = "ibm5150_82_v4"
speaker = true
overlays = [
    "pcxt_4_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# ...and THE configuration SPEC.md 18.98 exists for: the field 5150's own
# drives plus an IBM 4865 on the 5.25" adapter's external 37-pin connector.
# Two internal 360k and an 80-CYLINDER 720k as unit 2, which is the only place
# 18.96.2's size override is offered and the only drive that can pass its
# reach test. Unit 3 is a 360k, so one machine carries both answers: the
# toggle stands on C: and falls back on D:.
[[machine]]
name = "os8088_5150_cga_ext720"
type = "Ibm5150v256K"
rom_set = "ibm5150_82_v4"
speaker = true
overlays = [
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [machine.fdc]
    bus_type = "ISA"
    type = "IbmNec"

        [[machine.fdc.drive]]
        type = "360k"

        [[machine.fdc.drive]]
        type = "360k"

        [[machine.fdc.drive]]
        type = "720k"

        [[machine.fdc.drive]]
        type = "360k"

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# THE PARALLEL-PORT MACHINE (SPEC.md 51, docs/NET-PLAN.md 1.4). The CGA
# GLaBIOS 5150 with a Centronics card at 0x378, which is the ONLY os8088
# machine that has one - every other config here leaves the port range
# unpopulated, so NET.DRV's latch probe correctly finds nothing and refuses
# to attach. That is the right answer and it is not the one you want to be
# testing against (the ADLIB= reasoning exactly), because a driver that never
# attaches never publishes, so its Control Panel page never exists and the
# whole of SPEC.md 31.9's path is unreachable.
#
# WHAT IT CAN AND CANNOT ANSWER. MartyPC's ParallelPort has a readable data
# register and a writable status register, so `lp_latch` succeeds and the scan
# finds 0x378 - which is the whole attach path, the publication, the page and
# the desktop zone. It has NO PARTNER on the other end and there is no way to
# give it one: the status lines read a constant, so `mst_hello` times out and
# the page says `No partner`, which is docs/NET-PLAN.md 1.4.4's own
# distinction being drawn by the machine rather than by an argument. The WIRE
# is the 5150's question and `tests/lptlink` is how it is asked.
#
# GLaBIOS on purpose, unlike most of the file: nothing here is a TIMING
# question - the wire is bit-banged and the BIOS never sees it - so this is
# one of the machines that runs in a container with no IBM ROM in it.
[[machine]]
name = "os8088_5150_cga_lpt"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
    "parallel_port",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# --- THE 1.44MB MACHINE, and it is an ANACHRONISM ON PURPOSE ----------------
# `make combo144` builds a 1.44MB disk and nothing in this file could read one:
# every machine above takes `pcxt_2_360k_floppies`, so a 1.44MB image could be
# built here and never booted here, which is the shape this tree keeps paying
# for (a deliverable no harness can exercise).
#
# What it is NOT is a machine anybody had. A 1.44MB disk needs 500 kbps off the
# controller and the IBM XT's 8-bit card runs 250, so no stock XT reads one -
# it took a third-party 8-bit HD controller and a driver, and the 5150's own
# ROM tops out at 360KB whatever is plugged into it. MartyPC models the DRIVE
# (FloppyDriveType::Floppy144M, `1.44m`) but its FDC is the one `IbmNec` type,
# so what this proves is that OUR boot sector and OUR FAT12 code handle 18 spt
# on an 8088 - not that the media is period. Take no PERFORMANCE.md number off
# it and put no 1.44MB disk in the calibration 5150 (docs/FIELD-MACHINES.md).
#
# GLaBIOS rather than the IBM ROM for the ordinary reason - the IBM ROM is not
# in this container - and Hercules because that is the adapter the drag-cache
# work is driven on. The fdc is INLINE rather than an overlay so that no file
# of upstream's has to be patched: build.sh copies install/ wholesale and only
# ever APPENDS this file.
[[machine]]
name = "os8088_5150_herc_gla_144"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [machine.fdc]
    bus_type = "ISA"
    type = "IbmNec"
        [[machine.fdc.drive]]
        type = "1.44m"
        [[machine.fdc.drive]]
        type = "1.44m"

    [[machine.video]]
    bus_type = "ISA"
    type = "MDA"
    subtype = "Hercules"
    clock_mode = "Dynamic"

# A VGA AND A HERCULES, WHICH IS THE OTHER TWO-CARD MACHINE
# (docs/DUAL-DISPLAY-VGA.md). os8088_5150_both_gla is a Hercules beside a CGA -
# the calibration 5150's own pair, and the one SPEC.md 39.12-39.19's extended
# desktop ships for. This is the pair nobody in docs/FIELD-MACHINES.md owns and
# that the period actually built the most of: EGA/VGA plus MDA is what CodeView
# and Turbo Debugger ran on, the debugger on the mono monitor beside the
# application on the colour one.
#
# THE APERTURES ARE DISJOINT AND NO PATCH IS NEEDED, which is the whole of what
# Step 0 had to find out and is the opposite of the answer the Hercules+CGA pair
# got. Read out of the two constructors rather than assumed:
#
#   vga/mmio.rs   get_mapping() -> 0xA0000 (planes) and 0xB8000 (CGA window)
#   mda/mmio.rs   get_mapping() -> 0xB0000 only, since patches/02
#
# So `Bus::register_map`'s last-writer-wins has nothing to resolve, and the
# order of the two blocks below decides nothing at all - where for
# os8088_5150_both it decided which card silently vanished. os8088's own
# separation is the same one: mode 12h decodes A0000 (GR06 = 01b) and a
# Hercules' page 0 is B0000, and vid_setmode leaves 3BFh bit 1 clear so page 1
# never reaches B8000.
#
# ONE FIDELITY GAP, WRITTEN DOWN BECAUSE IT IS THE SHAPE THAT PRODUCES A FALSE
# PASS: MartyPC's VGA claims B8000 unconditionally, in the constructor, exactly
# as the MDA used to claim page 1 - a real VGA in mode 12h RELEASES B8000. It
# does not bite here, because the Hercules is at B0000 and os8088 never probes
# B8000 on a VGA machine (vid_probe_avail sets the CGA bit unprobed, mode 6
# being a standard BIOS mode there - SPEC.md 39.11.1). It WOULD bite a machine
# with a VGA and a real CGA in it, and that machine must not be added here
# without narrowing the VGA's mapping the way patches/02 narrowed the MDA's.
#
# The 5160 and glabios_xt because that is what os8088_xt_vga is and it is the
# VGA machine known to come up with a video BIOS in this tree; the IBM ROM sets
# are not in this container at all. Hercules second so that MartyPC's own
# primary is the VGA, which is also the card os8088's probe answers with
# (vid_detect's AH=1Ah DCC rung is reached before the equipment word) - so
# nothing here needs --primary and the boot gate watches card 0 by default.
[[machine]]
name = "os8088_xt_vga_herc"
type = "Ibm5160"
rom_set = "glabios_xt"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "VGA"
    clock_mode = "Default"

    [[machine.video]]
    bus_type = "ISA"
    type = "MDA"
    subtype = "Hercules"
    clock_mode = "Dynamic"

# ...and the GLaBIOS twin of the SOUND machine, which is the one a CONTAINER
# can actually run. `os8088_5150_sb` above wants `ibm5150_82_v4`, and that ROM
# is IBM's and is not in this tree, so a fresh checkout has GLaBIOS and nothing
# else - and until this stanza existed that meant NO machine here had a Sound
# Blaster in it at all. Every other class already had its `_gla` twin for
# exactly this reason (`_cga_gla`, `_herc_gla`, `_both_gla`); the sound machines
# did not, so any measurement of the mixer had to be taken somewhere else.
#
# The ROM is the only difference from `os8088_5150_sb` - same 8088 at 4.77MHz,
# same CGA, same AdLib at 0x388 and same DSP 2.01 at 0x220 - and the one thing
# it is NOT good for is a DISK number: PERFORMANCE.md Set 38 measured GLaBIOS's
# `int 13h` at 1.61x lighter than the period ROM's. A CPU-bound measurement
# taken while the drive is stopped does not touch that.
[[machine]]
name = "os8088_5150_sb_gla"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

    [[machine.sound]]
    type = "AdLib"
    io_base = 0x388

    [[machine.sound]]
    type = "SoundBlaster"
    io_base = 0x220
    irq = 7
    dsp_version = [2, 1]

