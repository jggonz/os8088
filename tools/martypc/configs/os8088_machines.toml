    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

    [machine.hdc]
    bus_type = "ISA"
    type = "XtIde"

        [[machine.hdc.drive]]
        format = "Mfm"
        vhd = "default_xtide.vhd"

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

    [[machine.sound]]
    type = "AdLib"
    io_base = 0x388

    [[machine.sound]]
    type = "SoundBlaster"
    io_base = 0x220
    irq = 7
    dsp_version = [2, 1]

[[machine]]
name = "os8088_5150_herc_gla"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0xA0000
    conventional.wait_states = 0

