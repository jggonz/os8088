# =============================================================================
# ...and the SAME MACHINE AT 256KB, which is a different question rather than a
# smaller machine (WEAVE-SPEC 1.4, 13.1's wave-7 row).
#
# 256KB is the Weave family's FLOOR: at 128KB the kernel is kern_small, which
# refuses GFX_BLIT1, WM_TIMER and WM_ONDRAG by CF=1, and WEAVE-SPEC 9.12 puts
# the family's floor at this machine for that reason. What 1.4 states about it
# is an arithmetic - "exactly ONE Weave app at a time... the second launch
# refuses BEFORE ANY I/O" - and tests/weaveone.py is what reads that off the
# glass rather than off the document.
#
# WHY IT IS NOT os8088_5150_sb_256k, WHICH ALREADY EXISTS. That machine asks
# for rom_set = "ibm5150_82_v4", which is IBM's ROM: tools/martypc/build.sh
# says in as many words that it is not in this tree and cannot be, and a
# container or a fresh clone therefore cannot boot it. A gate that only runs on
# a machine with a licensed ROM on it is a gate that quietly does not run, so
# this one is GLaBIOS - the same rom_set every other automated row in this tree
# uses - and CGA, which is the target class (SPEC.md 39.4).
#
# THE BOOT IS SLOWER AT THIS SIZE and the harness has to be told: the 128KB
# machine's own note in docs/MARTYPC-DEBUG.md says `settle`'s menu-bar gate
# fires on the splash there, because a slow machine holds a still frame for
# longer than the gate's patience. The same applies here and tests/weaveone.py
# waits on the desktop rather than on the gate.
[[machine]]
name = "os8088_5150_cga_gla_256k"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0x40000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

# ============================================================================
# THE SMALL MACHINES (SPEC.md 18.95.5). GLaBIOS, so they need no ROM this tree
# does not fetch - which is the whole reason they exist: the period-ROM 128K
# config cannot boot here, and 256K is the smallest machine that could.
#
# The kernel's ladder is ~117KB, so conventional memory minus that is the heap,
# and the heap is what dsk_rah_want solves its width from (n = free_run / 9,
# capped at DSK_RAH_RUNS, floored at DSK_RAH_MIN). 256K picks the ceiling and
# says nothing about the range; these two say what happens inside it and under
# it, and they are the only way to SEE either without a field machine.
#
#   192K -> 76KB of heap -> a PARTIAL width, which is what 18.95.5 is for
#   128K -> 11KB of heap -> under the floor: no cache. MIN_RAM_KB exactly, so
#                           it is also the smallest machine this OS claims to
#                           run - AND IT DOES NOT REACH A DESKTOP. Measured
#                           both sides of SPEC.md 18.95.5, so it is not that
#                           change: the same config never gets there on the
#                           commit before it either. Left here because the
#                           machine is the instrument that found it and it is
#                           the one to re-run when somebody takes the question
#                           up; nothing else in this tree can boot 128K, the
#                           period-ROM config needing a ROM we do not fetch
#
# CHECK [mem_top] IN THE GUEST, NOT THE NUMBER IN THIS FILE. A first cut asked
# for 0x24000 (144K) and the guest came up with 192K - the same machine twice,
# which reads as the width ignoring the config rather than as the config not
# taking. The two sizes above are the ones observed to survive the round trip.
#
# AND COPY THE WHOLE REFERENCE MACHINE, video block included. The same first
# cut left [[machine.video]] out; the guest still booted and still answered
# memory reads, so a probe that never draws reports plausible numbers off a
# machine with no CGA in it - and SPEC.md 39.22 skips .vgabuf on a machine with
# no VGA, so the ladder those numbers came off was not this one.
#
# `type` is the MOTHERBOARD, not the total: os8088_5150_cga_gla is
# Ibm5150v256K and comes up with 640K and a 524KB heap, which is why it picks
# the ceiling and can say nothing about the range below it.
#
# Everything else is os8088_5150_cga_gla's, so a difference between them is the
# memory and nothing else.
# =============================================================================
[[machine]]
name = "os8088_5150_gla_192k"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0x30000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"

[[machine]]
name = "os8088_5150_gla_128k"
type = "Ibm5150v256K"
rom_set = "glabios_pc"
speaker = true
overlays = [
    "pcxt_2_360k_floppies",
    "pcxt_2_serial_ports",
    "us_modelf_keyboard",
    "microsoft_serial_mouse_com1",
]

    [machine.memory]
    conventional.size = 0x20000
    conventional.wait_states = 0

    [[machine.video]]
    bus_type = "ISA"
    type = "CGA"
    clock_mode = "Dynamic"
