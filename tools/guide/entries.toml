# One-line descriptions of every file and folder on the shipped floppies,
# written for the user-facing guide. One table per name; folders end in "/".
# kind: program, driver, system, font, document, music, picture, video,
#       data, folder, dos-tool

# --- folders ----------------------------------------------------------------

["APPDATA/"]
title = "Application data"
kind = "folder"
summary = "Where programs keep their settings, high scores and saved state, inside SYSTEM. You can leave it alone."
short = "Settings and saved state"

["APPS/"]
title = "Applications"
kind = "folder"
summary = "The everyday programs: editors, tools, players and utilities. Double-click one to start it."
short = "The everyday programs"

["AUTOSTRT/"]
title = "Startup items"
kind = "folder"
summary = "Links placed here (made with an Alt-drop) open automatically after the machine boots. Hold Shift during boot to skip them."
short = "Programs that run at boot"

["DOS/"]
title = "DOS tools"
kind = "folder"
summary = "Small MS-DOS programs to copy onto a PC running DOS, for sharing files and disks with this machine."
short = "Tools for a PC running DOS"

["FONTS/"]
title = "Fonts"
kind = "folder"
summary = "The typefaces installed on the system, with their licence. Double-click a face to preview it in Font Viewer."
short = "Installed typefaces"

["GAMES/"]
title = "Games"
kind = "folder"
summary = "The games collection. Double-click one to play."
short = "The games collection"

["MEDIA/"]
title = "Media"
kind = "folder"
summary = "Sample documents, pictures, music and video to open in the matching programs. File dialogs start here."
short = "Sample files to open"

["MIDI/"]
title = "MIDI songs"
kind = "folder"
summary = "Ten demo songs for MIDIRack, from Fur Elise and The Entertainer to original game music."
short = "Demo songs for MIDIRack"

["NOTES/"]
title = "Notes"
kind = "folder"
summary = "Sticky Note's notes, one text file each, inside SYSTEM/APPDATA on the system disk."
short = "Sticky Note's notes"

["STIKAPPS/"]
title = "Sticky Apps"
kind = "folder"
summary = "Desktop widgets that live on the desktop itself and come back where you left them at every boot."
short = "Widgets that live on the desktop"

["SYSTEM/"]
title = "System folder"
kind = "folder"
summary = "The system's own folders: the typefaces, the programs' settings, and Task Manager, The Wire and Redline Apply."
short = "Files the system runs on"

# --- the system itself --------------------------------------------------------

["KERNEL.SYS"]
title = "os8088 system"
kind = "system"
summary = "The operating system itself, loaded when the machine boots from this disk. Do not move or delete it."
short = "The operating system itself"

["BOOTHD.SYS"]
title = "Hard disk boot sector"
kind = "system"
summary = "The startup code written onto a hard disk when you install os8088 there. The installer uses it."
short = "Startup code for hard disks"

["COLDHMA.SYS"]
title = "High memory image"
kind = "system"
summary = "Lets the system move part of itself above 1MB on machines that have the memory, leaving more room for programs."
short = "Moves system code above 1MB"
needs = "A 286 or better with memory above 1MB"

["ASSOC.DAT"]
title = "File associations"
kind = "system"
summary = "The system's list of which program opens which kind of document, so a double-click opens the right one."
short = "Which program opens what"

["CTRL.DRV"]
title = "Control Panel"
kind = "system"
summary = "The Control Panel, loaded when you open it: display, theme, sound, clock, drivers and other settings."
short = "Display, sound and settings"

["DESK.DRV"]
title = "Desktop widgets"
kind = "system"
summary = "Lets desktop widgets such as the Desk Calendar be placed, dragged and shown on the desktop."
short = "Support for desktop widgets"

["DISKOPS.DRV"]
title = "Disk operations"
kind = "system"
summary = "Copies a whole floppy sector for sector, to another floppy or to an image file and back, and compresses or expands files."
short = "Copy disks, compress files"

["DOCK.DRV"]
title = "Dock options"
kind = "system"
summary = "Extra dock behaviour: standing it on the left or right edge of the screen and hiding it automatically."
short = "Move or auto-hide the dock"

["EXTD.DRV"]
title = "Extended desktop"
kind = "system"
summary = "Spreads the desktop across two monitors so windows can be moved from one screen to the other."
short = "Desktop across two monitors"
needs = "Two display cards, such as a VGA or CGA beside a Hercules"

["FDLG.DRV"]
title = "File chooser"
kind = "system"
summary = "The Open and Save As chooser programs show, loaded when one asks for it. On the system disks for 128 KB machines."
short = "Open and Save As chooser"

["FILECP.DRV"]
title = "Copy and paste files"
kind = "system"
summary = "Cut, Copy, Paste and Paste Into for files in a Disk window, loaded when you use them. On the system disks for 128 KB machines."
short = "Cut, copy and paste files"

["FORMAT.DRV"]
title = "Disk formatter"
kind = "system"
summary = "Formats a blank floppy so the system can store files on it. Loaded when you choose Format Disk."
short = "Formats blank floppies"

["FSCHECK.DRV"]
title = "Disk checker"
kind = "system"
summary = "Checks a disk's file allocation table, folders and file chains, repairs what it safely can, and defragments the disk. Loaded by System Check, beside which it sits."
short = "Checks, repairs, defragments"

["HIBER.DRV"]
title = "Hibernate"
kind = "system"
summary = "Saves the whole machine, open programs and all, to a file on the hard disk and restores it later."
short = "Save the machine, resume later"
needs = "A hard disk"

["STIKMENU.DRV"]
title = "Sticky Apps menu"
kind = "system"
summary = "The menu that lists the Sticky Apps on your disks and lets you open, hide, show and arrange them."
short = "Menu for Sticky Apps"

["WIN95.DRV"]
title = "Windows theme"
kind = "system"
summary = "The Windows theme's look: close, maximize and minimize buttons on the right, a size grip and click-open menus."
short = "Windows-style window look"

["THMPAL.DRV"]
title = "Color theme presets"
kind = "system"
summary = "The Customize window for the Color theme: eight preset colour schemes and the title bar style. The Control Panel opens it."
short = "Preset colour schemes"

["HDDTOOL.DRV"]
title = "Hard disk tool"
kind = "system"
summary = "The hard disk setup tool, used to partition and format a hard disk and install os8088 onto it."
short = "Partition and install on a disk"
needs = "A hard disk"

["HTTPPAGE.DRV"]
title = "HTTP drive settings"
kind = "system"
summary = "The Control Panel page for the HTTP drive: the web address to mount, and Mount and Unmount."
short = "HTTP drive settings page"

["RAMPAGE.DRV"]
title = "RAM disk settings"
kind = "system"
summary = "The Control Panel page for the RAM disk: its size, and saving or restoring its contents as one file."
short = "RAM disk settings page"

# --- drivers ------------------------------------------------------------------

["SOUND.DRV"]
title = "Sound driver"
kind = "driver"
summary = "Lets programs play music and sound on an AdLib, Sound Blaster, MPU-401 MIDI interface or Covox, beyond the built-in PC speaker."
short = "Music and sound on any card"
needs = "An AdLib, Sound Blaster, MPU-401 or Covox"

["CDRACK.O88"]
title = "CDRack"
kind = "program"
summary = "Plays audio CDs in the CD-ROM drive behind the face of an 80s rack CD player: an LCD with the track grid, the transport, volume, repeat, shuffle, a program and the track list, in colour or black and white, with a compact player for small screens. Opens a TRACKnn.CDA file on that track."
short = "Plays audio CDs"
needs = "CDROM.DRV and an IDE CD-ROM drive"

["MIXER.O88"]
title = "Mixer"
kind = "program"
summary = "Adjusts a Sound Blaster's source levels, stereo balance and supported tone controls. Open it from the apps disk's APPS folder."
short = "Sound-card levels and balance"
needs = "SOUND.DRV and a compatible hardware mixer"

["HDD.DRV"]
title = "Hard disk driver"
kind = "driver"
summary = "Lets the machine use MFM and IDE hard disks: mounting their drives, setting them up and booting from them."
short = "Use MFM and IDE hard disks"
needs = "A hard disk"

["ETHER.DRV"]
title = "Ethernet driver"
kind = "driver"
summary = "Connects the machine to a network and the internet, for the Browser, Telnet, the FTP server, The Wire and WireChat."
short = "Network and internet access"
needs = "An NE1000 or NE2000 network card"

["PCIETHER.DRV"]
title = "PCI Ethernet driver"
kind = "driver"
summary = "Connects a PCI machine to a network and the internet through a Realtek RTL8139 card, for the same programs the Ethernet driver serves."
short = "Network and internet on a PCI card"
needs = "A 386 or better with a Realtek RTL8139 PCI network card"

["NET.DRV"]
title = "Parallel link"
kind = "driver"
summary = "Links to a DOS PC over a LapLink parallel cable, so its files appear here as an ordinary drive."
short = "Share a PC's files by cable"
needs = "A LapLink cable to a PC running OS88NET.COM"

["XMEM.DRV"]
title = "Extended memory"
kind = "driver"
summary = "Lets programs and the RAM disk use memory above 1MB, and frees room by moving part of the system up there."
short = "Use memory above 1MB"
needs = "A 286 or better with memory above 1MB"

["EMS.DRV"]
title = "Expanded memory"
kind = "driver"
summary = "Lets programs use the extra memory on a LIM EMS expanded memory board."
short = "Use expanded memory boards"
needs = "A LIM EMS memory board"

["CDROM.DRV"]
title = "CD-ROM drive"
kind = "driver"
summary = "Reads CD-ROM discs in an IDE CD-ROM drive as a drive on the desktop, and plays audio CDs through the drive's own audio output."
short = "CD-ROM discs and audio CDs"
needs = "A 286 or better with an IDE (ATAPI) CD-ROM drive"

["HTTPFS.DRV"]
title = "HTTP drive"
kind = "driver"
summary = "Mounts a folder published on a web server as a read-only drive on the desktop. The Control Panel's Web Drive page takes the address."
short = "A read-only drive from a web address"
needs = "A network card, or the parallel link"

["RAMDISK.DRV"]
title = "RAM disk"
kind = "driver"
summary = "Makes a fast drive out of memory for temporary files. Its contents can be saved to a file and restored."
short = "A fast drive made of memory"

["SAVER.DRV"]
title = "Screen saver"
kind = "driver"
summary = "The animated screen saver: a bouncing cube, a starfield, geometric shapes or sea life, set in the Control Panel."
short = "Animated screen saver"

["USBMOUSE.DRV"]
title = "USB mouse driver"
kind = "driver"
summary = "Lets you use a USB mouse plugged into a Book8088's USB socket or a PicoMEM card."
short = "USB mouse on the Book8088"
needs = "A Book8088 (CH375 USB) or a PicoMEM card"

# --- programs: applications -------------------------------------------------

["CALC.O88"]
title = "Calculator"
kind = "program"
summary = "A four-function desk calculator with a fold-out history. Click a past answer to start the next sum from it."
short = "Desk calculator with history"

["PAGEDESK.O88"]
title = "PageDesk"
kind = "program"
summary = "Reads and marks up PDF files. Highlights, notes, text boxes and drawings are saved into a new copy; pages can be rotated, moved, extracted and inserted from another file."
short = "PDF viewer and editor"

["PAGEDESK/"]
title = "PageDesk"
kind = "folder"
summary = "PageDesk's decoders for compressed images, fonts and encrypted files. They are read from here when a page needs them, so leave the folder where it is."
short = "PageDesk's helper modules"

["PDFONTS.TXT"]
title = "PageDesk font licence"
kind = "document"
summary = "The licence of the Liberation fonts PageDesk draws text in. Opens in Note Pad."
short = "Font licence for PageDesk"

["PDFONTX.RES"]
title = "PageDesk extra font sizes"
kind = "data"
summary = "The other text sizes PageDesk uses for pages set in 6 to 24 pixel type. Optional: without it PageDesk scales the nearest size it has."
short = "Extra text sizes for PageDesk"

["HELLO.PDF"]
title = "Hello (PDF)"
kind = "document"
summary = "A one-page sample with text and simple drawings, the quickest file to try PageDesk on. Opens in PageDesk."
short = "One-page sample"

["XTGUIDE.PDF"]
title = "XT guide (PDF)"
kind = "document"
summary = "A twelve-page illustrated guide with a table of contents and links between pages. Opens in PageDesk."
short = "Twelve-page sample with links"

["MARKUP.PDF"]
title = "Markup worksheet (PDF)"
kind = "document"
summary = "A two-page worksheet to practise highlights, notes and text boxes on. Opens in PageDesk."
short = "Sample to mark up"

["PAGES.PDF"]
title = "Pages (PDF)"
kind = "document"
summary = "Eight pages in different sizes and rotations, for trying page rotation, moving, extracting and inserting. Opens in PageDesk."
short = "Sample for page operations"

["LATIN.PDF"]
title = "Latin text (PDF)"
kind = "document"
summary = "A sample of text in several encodings, with accented letters and punctuation in the standard fonts. Opens in PageDesk."
short = "Accented-text sample"

["MONOIMG.PDF"]
title = "Black and white pictures (PDF)"
kind = "document"
summary = "A sample with one-bit, grey and stencil images. Opens in PageDesk."
short = "Image sample"

["FLATE.PDF"]
title = "Compressed streams (PDF)"
kind = "document"
summary = "A sample whose page is stored compressed, as most PDFs are. Opens in PageDesk."
short = "Compressed sample"

["ACROFORM.PDF"]
title = "Form (PDF)"
kind = "document"
summary = "A sample with form fields. PageDesk shows the form as printed and does not fill it. Opens in PageDesk."
short = "Form sample"

["NOTEPAD.O88"]
title = "Note Pad"
kind = "program"
summary = "A simple text editor with word wrap. It reads and writes plain text files that DOS can read too."
short = "Simple plain text editor"

["TEXPAD.O88"]
title = "TeXPad"
kind = "program"
summary = "A two-pane TeX editor: source on the left, typeset page on the right, exporting PDF or PostScript."
short = "TeX editor with live preview"

["ARTFUL.O88"]
title = "ArtfulType"
kind = "program"
summary = "A distraction-free Markdown writer that takes the whole screen, showing headings and emphasis as you type."
short = "Full-screen Markdown writer"

["WORD.O88"]
title = "Microsoft Word"
kind = "program"
summary = "A recreation of Word for Windows 1.1a with rulers, page view and real .DOC files, plus RTF in and out."
short = "Word for Windows 1.1a remake"

["SHEET.O88"]
title = "Sheet"
kind = "program"
summary = "A spreadsheet in the style of Excel 2.1, with four sheets to a workbook, formulas, formats, a database, macros, charts, and Excel, SYLK, DIF, CSV and dBASE files."
short = "Excel 2.1-style spreadsheet"

["CHART.O88"]
title = "Chart"
kind = "program"
summary = "Opens a spreadsheet file, draws a chart from a column of its numbers, and can save the chart as a BMP."
short = "Charts from spreadsheet data"

["PAINT.O88"]
title = "Paint"
kind = "program"
summary = "A bitmap painting program with eight tools, undo and a clipboard. It opens and saves BMP and GIF pictures."
short = "Bitmap painting program"

["PIXEL.O88"]
title = "PiXEL"
kind = "program"
summary = "An image viewer and editor that opens JPEG, PNG, GIF, BMP, PCX, TIFF and more, with a full-screen view."
short = "Image viewer and editor"

["FONTVIEW.O88"]
title = "Font Viewer"
kind = "program"
summary = "Lists the installed typefaces and shows a sample you can type into, in whichever face you pick."
short = "Preview installed typefaces"

["FRACTAL.O88"]
title = "Fractal"
kind = "program"
summary = "Draws five kinds of fractal in the background, band by band, while you keep using the desktop."
short = "Background fractal drawing"

["PIANO.O88"]
title = "Piano"
kind = "program"
summary = "A playable piano keyboard with a scrolling note viewer, replay of what you played and three built-in songs."
short = "Playable piano keyboard"

["TRACKER.O88"]
title = "Tracker"
kind = "program"
summary = "Plays Amiga MOD music modules with a playlist, in a window or full screen with pattern display."
short = "Amiga MOD music player"

["AUDIO.O88"]
title = "Audio Player"
kind = "program"
summary = "Plays WAV sound files from disk. With a Sound Blaster it keeps playing while you work in other programs."
short = "Background WAV player"

["MIDIRACK.O88"]
title = "MIDIRack"
kind = "program"
summary = "Plays standard MIDI song files with a channel rack, on an FM chip, a Sound Blaster, MIDI out or the PC speaker."
short = "MIDI song player with rack"

["WAVERACK.O88"]
title = "WaveRack"
kind = "program"
summary = "Records, plays and edits WAV sound files behind the face of an 80s digital recorder: a level meter, the waveform you can zoom into, select and cut, and a take recorded straight onto the disk, ideally a hard disk. Opens 8- and 16-bit mono and stereo WAVs of any length; saves without ever writing over the original until the new file is whole."
short = "Sound recorder and WAV editor"
needs = "A Sound Blaster to play and record; editing needs nothing"

["XTMP3.O88"]
title = "XTMP3"
kind = "program"
summary = "Plays MP3 files behind the face of an 80s stereo component, at the best quality this computer and its sound card can keep up with, and says which quality that is. On a slow PC it decodes the song to a WAV file on the hard disk first, then plays that."
short = "MP3 player for every PC"
needs = "A sound card to play while decoding; otherwise a hard disk and the PC speaker or a Covox"

["VIDEO.O88"]
title = "Video Player"
kind = "program"
summary = "Plays full-motion .V88 videos, in a window or full screen, with sound on a Sound Blaster or the PC speaker."
short = "Plays .V88 videos"

["VBATTLE.O88"]
title = "Video Battle"
kind = "program"
summary = "A turn-based battle whose picture is video: an idle loop plays while you pick commands from a menu, and each command's clip joins the loop and returns to it, over the battle's music."
short = "Battles made of video clips"

["VBATTLED.O88"]
title = "Video Battle, with a play record"
kind = "program"
summary = "Video Battle built to write a record of each play, VBPROF1.DAT, beside itself, for finding out why a battle stutters on a machine."
short = "Video Battle that logs each play"

["INSTALL.O88"]
title = "Install"
kind = "program"
summary = "Puts os8088 on a hard disk, or upgrades the copy already there, one page at a time: switches the hard-disk driver on, finds the drives, lets you pick a partition and keep or erase its files, then copies the system and apps disks."
short = "Install os8088 on a hard disk"

["SYSCHECK.O88"]
title = "System Check"
kind = "program"
summary = "Checks the disk the machine starts from for parts left over or broken by an upgrade, and cleans up what is safe to remove. Also checks, repairs and defragments any disk, with FSCHECK.DRV."
short = "Installed system checker"

["SNDDIAG.O88"]
title = "Sound Debug"
kind = "program"
summary = "Shows what the sound driver found on this machine - where each card answered, its version, its interrupt, its mixer - and plays a ten-second tone, a line a second, to show whether the card keeps playing. On the sound debug disk, for photographing and sending to the project."
short = "Sound card report"

["TASKMGR.O88"]
title = "Task Manager"
kind = "program"
summary = "Shows live CPU load and memory use for every running program, with a map of where memory has gone."
short = "CPU and memory monitor"

["TIMER.O88"]
title = "Timer"
kind = "program"
summary = "A stopwatch with Start, Stop and Reset buttons, counting in hours, minutes and seconds."
short = "Stopwatch"

["BOUNCE.O88"]
title = "Bounce"
kind = "program"
summary = "A small black square bouncing around its own window. A tiny demonstration program."
short = "Bouncing square demo"

["DESKCAL.O88"]
title = "Desk Calendar"
kind = "program"
summary = "A calendar widget on the desktop showing today, the month, your appointments and tasks, with reminders that ring."
short = "Desktop calendar widget"

["STIKNOTE.O88"]
title = "Sticky Note"
kind = "program"
summary = "A pad of notes and checklists on the desktop: each note is a text file you write in Note Pad, and you tick its boxes with a click."
short = "Notes and checklists on the desktop"

["DESKCLOK.O88"]
title = "Desk Clock"
kind = "program"
summary = "A clock on the desktop in nine faces and three sizes, with the date and a daily alarm with Snooze and Dismiss."
short = "Desktop clock with an alarm"

["RLAPPLY.O88"]
title = "Redline Apply"
kind = "program"
summary = "Puts back the bus timing setting saved by the Redline benchmark, after each boot, then quits."
short = "Restores Redline timing"
needs = "A 286 or 386 tuned with Redline"

["DOS.O88"]
title = "DOS"
kind = "program"
summary = "Runs MS-DOS .COM and .EXE programs. Double-click a DOS program and it starts here."
short = "Runs MS-DOS programs"

["THEWIRE.O88"]
title = "The Wire"
kind = "program"
summary = "Browses the os8088 online software library, then runs a program straight from the network or saves it to disk."
short = "Online software library"
needs = "A network card"

["BROWSER.O88"]
title = "Browser"
kind = "program"
summary = "A text-and-tables web browser. It opens web pages over the network or HTML files from a disk."
short = "Text-and-tables web browser"
needs = "A network connection for web pages"

["TELNET.O88"]
title = "Telnet"
kind = "program"
summary = "A terminal for logging in to other computers over the network."
short = "Terminal for remote logins"
needs = "A network card or parallel link"

["FTPD.O88"]
title = "FTP Server"
kind = "program"
summary = "Turns the machine into an FTP server, so a modern computer can send and fetch files from its disks."
short = "Serve your files over FTP"
needs = "A network card or parallel link"

["WIRECHAT.O88"]
title = "WireChat"
kind = "program"
summary = "Chat rooms for os8088 users: four public rooms, private messages, friends and a status, over the network."
short = "Chat rooms on the network"
needs = "A network card or parallel link"

# --- programs: games ----------------------------------------------------------

["MINES.O88"]
title = "Minesweeper"
kind = "program"
summary = "The classic mine-finding puzzle on a 9 by 9 board. Right-click to flag a mine."
short = "Classic mine-finding puzzle"

["SOLITAIR.O88"]
title = "Solitaire"
kind = "program"
summary = "Klondike Solitaire with drag-and-drop cards."
short = "Klondike card game"

["ARKANOID.O88"]
title = "Arkanoid"
kind = "program"
summary = "Break the bricks with a ball and paddle in this classic arcade game."
short = "Brick-breaking arcade game"

["MISSILE.O88"]
title = "Missile Command"
kind = "program"
summary = "Defend your cities from falling missiles in a port of Atari's 1980 arcade game."
short = "Defend cities from missiles"

["CYCLONE.O88"]
title = "Cyclone 88"
kind = "program"
summary = "A tube shooter in the style of Tempest 2000: spin around the rim and blast what climbs up."
short = "Tempest-style tube shooter"

["TAMEGRAM.O88"]
title = "TameGram"
kind = "program"
summary = "A falling-block puzzle where gravity changes direction. Line up eight of one faction to clear them. By Jason Page."
short = "Gravity-shifting block puzzle"

["DOTDEL.O88"]
title = "Dot Delirium"
kind = "program"
summary = "A maze chase in the Pac-Man tradition starring Smiles, in a window or full screen."
short = "Pac-Man-style maze chase"

["DRMARCO.O88"]
title = "DrMarco"
kind = "program"
summary = "A pill-dropping puzzle game remade from the NES Dr. Mario. Match colours to clear the viruses."
short = "Pill-dropping virus puzzle"

["GORILLAS.O88"]
title = "Gorillas"
kind = "program"
summary = "Banana-throwing artillery across a city skyline, solo or two players, adapted from the QBasic classic."
short = "Banana-throwing artillery game"

["TANK.O88"]
title = "Tank Attack"
kind = "program"
summary = "A first-person wireframe tank battle in the spirit of the 1980 arcade game, played full screen."
short = "Wireframe tank battle"

["SKIES.O88"]
title = "Clear Skies"
kind = "program"
summary = "A 3D flight simulator: five aircraft, from a Cessna to a glider and an amphibian, over nine places from Paris to Nepal."
short = "3D flight simulator"

["PXSTEIN.O88"]
title = "Pixelstein 3D"
kind = "program"
summary = "A first-person maze shooter in the style of the 1992 classic, with eight floors, doors, keys and guards."
short = "First-person maze shooter"

["ISOTRON.O88"]
title = "isoTron"
kind = "program"
summary = "A light-wall duel against the computer on a raised 3D arena that rises a level after two wins in a row."
short = "Light-wall duel in 3D"

["WIREBALL.O88"]
title = "WireBall"
kind = "program"
summary = "Pong full screen. Play another computer over a null modem cable, or practise against the computer."
short = "Full-screen Pong, two players"
needs = "A null modem cable and a second machine for two players"

["WIREFLET.O88"]
title = "WireFleet"
kind = "program"
summary = "Place five ships, take alternate shots and chat with a friend over a serial null modem. Reconnect to continue the same match, or save it on each PC and load it later. F toggles fullscreen, including four-color CGA."
short = "Naval battles between two PCs"
needs = "Two machines, a null modem cable, and a free COM1 or COM2; Connect may ask for the system disk"

["VESA.DRV"]
title = "VESA display driver"
kind = "driver"
summary = "Puts the desktop on a VGA card's high-resolution screen, up to 1024 by 768, when the card has a VESA BIOS. The desktop keeps 16 colours; a program can draw a picture in up to 65,536."
short = "High-resolution desktop on a VESA card"
needs = "A VGA card with a VESA BIOS (VBE 1.2 or later), in a 286 or better"

["SERIAL.DRV"]
title = "Desktop serial service"
kind = "system"
summary = "Loaded from the system disk when a desktop program connects to a COM port. Keeps serial traffic separate from the mouse and releases the port when the program closes."
short = "On-demand desktop COM-port service"

# --- DOS tools ----------------------------------------------------------------

["OS88CZ.COM"]
title = "OS88CZ"
kind = "dos-tool"
summary = "A DOS program that splits big files across floppies and joins them back, compatible with os8088's compressed files."
