# --- music --------------------------------------------------------------------

["BEVERLY.MOD"]
title = "Beverly Hills Cop"
kind = "music"
summary = "The Beverly Hills Cop theme as an Amiga music module. Plays in Tracker."
short = "Music module for Tracker"

["BATTLE1.MID"]
