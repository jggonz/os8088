<style>
/* Layout: a selection header (size tabs, then the disks of that size as
   labelled floppies), and below it two System-1 windows side by side: the
   disk's own window on the left, the Get Info window on the right. */
:root {
  --paper: #eef0f3;
  --sheet: #fbfbfc;
  --ink: #15171c;
  --ink-2: #555b67;
  --rule: #c5c9d1;
  --rule-strong: #15171c;
  --well: #e3e6eb;
  --accent: #2443a0;
  --accent-ink: #ffffff;
  --tint: #dde4f6;
  --warn: #8a5a00;
  --font-display: "Pixelify Sans", "Chicago", "Geneva", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101216; --sheet: #171a1f; --ink: #e6e8ec; --ink-2: #9aa1ad;
    --rule: #2e333c; --rule-strong: #c9cdd5; --well: #1d2027;
    --accent: #8ea6f2; --accent-ink: #0d1020; --tint: #1f2844; --warn: #e0b45a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101216; --sheet: #171a1f; --ink: #e6e8ec; --ink-2: #9aa1ad;
  --rule: #2e333c; --rule-strong: #c9cdd5; --well: #1d2027;
  --accent: #8ea6f2; --accent-ink: #0d1020; --tint: #1f2844; --warn: #e0b45a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}
.wrap { max-width: 1320px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
a { color: var(--accent); }

/* --- header ------------------------------------------------------------- */
header.top { padding-block: 8px 0; display: grid; gap: 6px; }
.brand-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); line-height: 1; margin: 0; letter-spacing: 0.01em; }
.brand .sub { color: var(--ink-2); font-size: var(--step--1); }
.search { position: relative; flex: 1 1 320px; max-width: 520px; }
.search input {
  width: 100%; padding: 4px 12px 4px 34px; border: 1px solid var(--rule-strong); border-radius: 0;
  background: var(--sheet); color: var(--ink); font: inherit;
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--rule); padding: 0 5px; }
.results {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--sheet); border: 1px solid var(--rule-strong); box-shadow: 3px 3px 0 var(--rule-strong);
  max-height: 60vh; overflow: auto;
}
.results button { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 5px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; cursor: pointer; }
.results button[aria-selected="true"], .results button:hover { background: var(--accent); color: var(--accent-ink); }
.results .r-title { display: grid; min-width: 0; line-height: 1.3; }
.results .r-title b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-title small { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.75; }
.results .empty { padding: 10px 12px; color: var(--ink-2); }

.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--rule-strong); }
.tabs button {
  flex: 0 0 auto; border: 1px solid transparent; border-bottom: 0; background: none; cursor: pointer;
  padding: 4px 16px 3px; display: grid; text-align: left; gap: 0; margin-bottom: -1px;
}
.tabs button .t { font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--sheet); border-color: var(--rule-strong); }
.tabs .gap { flex: 0 0 18px; }

.shelf { background: var(--sheet); border: 1px solid var(--rule-strong); border-top: 0; padding: 8px 10px; display: grid; gap: 8px; }
.cards { display: flex; gap: 8px; }
.cards > .card { flex: 1 1 0; }
.cards > .card.more { flex: 0 0 auto; }
@media (max-width: 760px) { .cards { flex-wrap: wrap; } .cards > .card { flex: 1 1 140px; } }
.card {
  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 8px; align-content: start; text-align: left;
  border: 1px solid var(--rule); background: var(--paper); padding: 4px 10px 5px; cursor: pointer; min-width: 0;
}
.card:hover { border-color: var(--rule-strong); }

.ownrow { border-top: 1px solid var(--rule); padding-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--paper); padding: 2px 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip:hover { border-color: var(--rule-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip small { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }

/* --- the two windows -------------------------------------------------------- */
main.panes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 11px; align-items: start; }
@media (min-width: 960px) { main.panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); } }
.win { background: var(--sheet); border: 1px solid var(--rule-strong); box-shadow: 3px 3px 0 var(--rule-strong); min-width: 0; }
.bar {
  position: relative; height: 22px; border-bottom: 1px solid var(--rule-strong); display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(to bottom, var(--sheet) 0 3px, var(--rule-strong) 3px 4px) 0 4px / 100% 13px no-repeat, var(--sheet);
}
.bar span { background: var(--sheet); padding: 0 10px; font-family: var(--font-mono); font-weight: 500; font-size: 13px; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar::before { content: ""; position: absolute; left: 8px; top: 4px; width: 11px; height: 11px; border: 1px solid var(--rule-strong); background: var(--sheet); }
.info-win { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); }
@media (min-width: 960px) { .info-win .body { max-height: calc(100vh - 48px); overflow: auto; } }
.body { padding: 10px 16px 16px; min-width: 0; }

.disk-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; justify-content: space-between; padding: 5px 14px; border-bottom: 1px solid var(--rule); font-size: var(--step--1); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.disk-head b { color: var(--ink); font-weight: 600; }
.tree { list-style: none; margin: 0; padding: 2px 0 6px; }
.row {
  display: grid; grid-template-columns: 14px minmax(7.5rem, auto) minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline;
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 3px 14px 3px calc(14px + var(--depth, 0) * 18px);
}
.row:hover { background: var(--well); }
.row[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.row[aria-current="true"] .desc, .row[aria-current="true"] .size { color: inherit; opacity: 0.85; }
.row .ic { align-self: center; display: flex; }
.row .nm { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.row .desc { color: var(--ink-2); font-size: var(--step--1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .desc b { color: var(--ink); font-weight: 500; }
.row[aria-current="true"] .desc b { color: inherit; }
.row .size { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row.folder .nm::after { content: "/"; opacity: 0.5; }
.row.hidden .nm { opacity: 0.7; }
.tree .sep { display: flex; align-items: center; gap: 10px; padding: 6px 14px 2px calc(14px + var(--depth, 0) * 18px); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.tree .sep::after { content: ""; flex: 1; border-top: 1px dotted var(--rule-strong); }
.tree .sep span { white-space: nowrap; }
.row .tw { display: inline-block; width: 1ch; margin-right: 2px; opacity: 0.6; }
@media (max-width: 560px) {
  .row { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .row .desc { grid-column: 2 / 4; white-space: normal; }
}
.notbuilt { padding: 22px 18px; color: var(--ink-2); }
.notbuilt code { color: var(--ink); }

/* --- the info window ------------------------------------------------------------- */
.info h2 { font-family: var(--font-body); font-weight: 600; font-size: var(--step-2); line-height: 1.2; margin: 0; text-wrap: balance; }
.info .ident { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 14px; align-items: start; margin-bottom: 10px; }
.info .ident .ic { grid-row: span 2; padding-top: 4px; }
.info .ident .fn { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.ihead { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--rule); }
.ihead .ic { display: flex; }
.ihead .where { display: grid; justify-items: end; gap: 2px; font-size: 12px; color: var(--ink-2); text-align: right; min-width: 0; }
.ihead .where .mono { font-size: 12px; overflow-wrap: anywhere; }
.also { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.also:hover { text-decoration: underline; }
@media (max-width: 560px) { .ihead { grid-template-columns: 36px minmax(0, 1fr); } .ihead .where { grid-column: 2; justify-items: start; text-align: left; } }
.alsolist { display: grid; gap: 4px; padding: 0 0 8px; margin: -2px 0 10px; border-bottom: 1px solid var(--rule); }
.alsolist .arow { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
.alsolist .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.alsolist .chip { padding: 1px 8px; font-size: 12px; }
.needs-line { display: flex; gap: 12px; align-items: baseline; margin: -4px 0 10px; color: var(--warn); font-size: var(--step--1); }
.needs-line span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.info .lede { font-size: var(--step-1); line-height: 1.4; margin: 0 0 10px; max-width: 62ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0 0 12px; padding: 8px 0; border-block: 1px solid var(--rule); font-size: var(--step--1); }

.facts dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
.facts dd .chips { gap: 4px; }
.facts dd .chip { padding: 1px 8px; font-size: 12px; }
.needs { color: var(--warn); }
.eyebrow { font-family: var(--font-display); font-weight: 500; font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
.manual { max-width: 68ch; }
.manual h2 { font-size: var(--step-1); margin: 20px 0 4px; }
.manual h3 { font-size: var(--step-0); margin: 18px 0 4px; }
.manual h4 { font-size: var(--step-0); margin: 14px 0 4px; color: var(--ink-2); }
.manual p, .manual li { margin: 0 0 10px; }
.manual ul, .manual ol { padding-left: 1.3em; margin: 0 0 10px; }
.manual .note { border-left: 3px solid var(--ink); padding: 6px 12px; background: var(--well); margin: 0 0 12px; font-size: var(--step--1); }
.manual .tbl { overflow-x: auto; margin: 0 0 14px; }
.manual table { border-collapse: collapse; font-size: var(--step--1); min-width: 100%; }
.manual th, .manual td { text-align: left; padding: 5px 12px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.manual th { font-weight: 600; border-bottom-color: var(--rule-strong); }
.shot { margin: 10px 0 14px; }
.shot .zoom { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 100%; }
.shot img { display: block; border: 1px solid var(--rule-strong); image-rendering: pixelated; max-width: 100%; height: auto; }
.shot.left, .shot.right { max-width: 48%; margin-top: 4px; }
.shot.left { float: left; margin-right: 18px; }
.shot.right { float: right; margin-left: 18px; }
.shot.left img, .shot.right img { width: auto; max-width: 100%; max-height: 22rem; }

.viewer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; gap: 10px; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--paper) 88%, transparent); cursor: zoom-out; }
.viewer[hidden] { display: none; }
.viewer figure { margin: 0; display: grid; gap: 8px; justify-items: center; max-width: 100%; max-height: 100%; }
.viewer img { image-rendering: pixelated; border: 1px solid var(--rule-strong); box-shadow: 4px 4px 0 var(--rule-strong); background: var(--sheet); max-width: 100%; max-height: calc(100vh - 110px); width: auto; height: auto; object-fit: contain; }
.viewer figcaption { font-size: var(--step--1); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule-strong); padding: 4px 10px; max-width: 70ch; text-align: center; }
.viewer .close { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); border: 1px solid var(--rule-strong); background: var(--sheet); padding: 2px 10px; cursor: pointer; }
.shot .frame { aspect-ratio: 4 / 3; max-width: 100%; border: 1px dashed var(--ink-2); display: grid; place-content: center; gap: 4px; text-align: center; color: var(--ink-2); background:
  repeating-linear-gradient(45deg, transparent 0 7px, var(--well) 7px 8px); }
.shot figcaption { font-size: var(--step--1); color: var(--ink-2); margin-top: 6px; }
.filetext { font-family: var(--font-mono); font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--well); border: 1px solid var(--rule); padding: 10px 12px; margin: 0 0 12px; max-height: 70vh; overflow: auto; }
.nomanual { color: var(--ink-2); border: 1px dashed var(--rule); padding: 12px 14px; font-size: var(--step--1); }
.members { display: grid; gap: 6px; margin: 0 0 12px; }
.prog-list { columns: 2 12rem; column-gap: 18px; padding: 0; margin: 0; list-style: none; font-size: var(--step--1); }
.prog-list li { break-inside: avoid; padding: 2px 0; }
.prog-list button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.prog-list button:hover span { text-decoration: underline; }
.prog-list .mono { color: var(--ink-2); font-size: 11px; margin-left: 6px; }
footer { margin-top: 16px; color: var(--ink-2); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// --- what a file is, when nobody has said ---------------------------------------
const EXT = {
  O88: ["program", "A program"], DRV: ["driver", "A driver"], SYS: ["system", "A system file"], DAT: ["data", "System data"],
  F88: ["font", "A typeface"], MID: ["music", "A MIDI song"], MOD: ["music", "A tracker module"], WAV: ["music", "A sound recording"],
  TEX: ["document", "A TexPad document"], DOC: ["document", "A Word document"], RTF: ["document", "A document"], MD: ["document", "A text document"],
  TXT: ["document", "A text file"], HTM: ["document", "A web page"], SLK: ["data", "A spreadsheet"], GIF: ["picture", "A picture"],
  JPG: ["picture", "A photograph"], BMP: ["picture", "A picture"], PIX: ["picture", "A picture"], V88: ["video", "A video"],
  COM: ["dos-tool", "A DOS program"], EXE: ["dos-tool", "A DOS program"], WAB: ["program", "A Weave app"], OVL: ["program", "Part of a program"],
  ROM: ["system", "A ROM image"], BAS: ["document", "A BASIC program"],

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function info(name, pi) {
  if (pi != null && D.pinfo[pi]) { const [kind, title, summary, short] = D.pinfo[pi]; return { kind, title, summary, short, needs: "", described: true }; }
  const e = D.entries[name];
  if (e) return { kind: e.kind || "document", title: e.title || name, summary: e.summary || "", short: e.short || "", needs: e.needs || "", described: true };
  if (name.endsWith("/")) return { kind: "folder", title: name.slice(0, -1), summary: "A folder", needs: "", described: false };
  const x = (name.split(".")[1] || "").toUpperCase(), g = EXT[x];

}
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024).toLocaleString() + " KB" : n.toLocaleString() + " bytes";

// --- indexes ---------------------------------------------------------------
const disk = Object.fromEntries(D.disks.map(d => [d.id, d]));
const set = Object.fromEntries(D.sets.map(s => [s.id, s]));

const where = {};                                   // file name -> [[diskId, path]]
D.disks.forEach(d => (d.tree || []).forEach(([p]) => { const n = baseName(p); (where[n] ||= []).push([d.id, p]); }));
const things = Object.fromEntries([...D.tools, ...D.firmware].map(t => [t.id, t]));

// --- state -----------------------------------------------------------------
const st = { geo: "1440", disk: null, item: null, open: {}, secOpen: {}, alsoOpen: false };
try { const g = localStorage.getItem("os88guide.geo"); if (g && geoLabel[g]) st.geo = g; } catch (e) {}

function disksFor(geo) { return D.disks.filter(d => d.geo === geo); }
function firstDisk(geo) {
  if (geo === "tools") return D.tools[0].id;
  if (geo === "firmware") return D.firmware[0].id;
  const l = disksFor(geo); return l.length ? l[0].id : null;
}
function go(geo, diskId, item, push) {
  const nd = diskId || firstDisk(geo);
  if (nd !== st.disk && disk[nd] && disk[nd].section !== "main") delete st.secOpen[disk[nd].section];
  st.geo = geo; st.disk = nd; st.item = item || null;
  try { localStorage.setItem("os88guide.geo", geo); } catch (e) {}
  if (push !== false) { const h = st.disk + (st.item ? "~" + st.item.replace(/\/$/, "") : ""); history.replaceState(null, "", "#" + h); }
  draw();
}

// --- the disk window ---------------------------------------------------------------
// Folders a reader rarely wants open, and how big a folder may be before it
// starts closed. A click remembers the reader's own choice for the session.
const COLLAPSED = new Set(["FONTS"]);
const HIDDEN = 0x06;                                // FAT hidden | system
function treeRows(d) {
  const kids = { "": [] };
  (d.tree || []).forEach(([p, size, attr, pi]) => {
    const dir = p.endsWith("/"), parts = p.replace(/\/$/, "").split("/"), par = parts.slice(0, -1).join("/");
    (kids[par] ||= []).push({ p, size, attr: attr || 0, dir, pi, name: parts[parts.length - 1] });
    if (dir) kids[parts.join("/")] ||= [];
  });
  const order = (a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name);
  const out = [];
  function row(e, depth) {
    const key = d.id + ":" + e.p, n = baseName(e.p), i = info(n, e.pi), ch = e.dir ? kids[e.p.replace(/\/$/, "")] : null;
    let open = false;
    if (e.dir) open = key in st.open ? st.open[key] : !COLLAPSED.has(e.name) && (depth === 0 ? ch.length <= 40 : ch.length <= 12);
    const cur = st.item === e.p;
    out.push(`<li><button class="row${e.dir ? " folder" : ""}${e.attr & HIDDEN ? " hidden" : ""}" style="--depth:${depth}" data-path="${esc(e.p)}" ${cur ? 'aria-current="true"' : ""} ${e.dir ? `aria-expanded="${open}"` : ""}>
      <span class="ic">${icon(i.kind)}</span>
      <span class="nm">${e.dir ? `<span class="tw">${open ? "▾" : "▸"}</span>` : ""}${esc(e.name)}</span>
      <span class="desc" title="${esc(i.summary)}">${i.described ? `<b>${esc(i.title)}</b>${(i.short || i.summary) ? " · " + esc(i.short || i.summary) : ""}` : (e.dir ? `${ch.length} items` : esc(i.summary))}</span>
      <span class="size">${e.dir ? "" : kb(e.size)}</span></button></li>`);
    if (open) level(ch, depth + 1);
  }
  function level(list, depth) {
    const shown = list.filter(e => !(e.attr & HIDDEN)).sort(order), hid = list.filter(e => e.attr & HIDDEN).sort(order);
    shown.forEach(e => row(e, depth));
    if (hid.length) {
      out.push(`<li class="sep" style="--depth:${depth}"><span>Hidden system files · ${hid.length}</span></li>`);
      hid.forEach(e => row(e, depth));
    }
  }
  level(kids[""], 0);
  return out.join("");
}
function drawLeft() {
  const el = document.getElementById("left"), t = document.getElementById("leftTitle");

  if (th) {
    t.textContent = th.title;
    el.innerHTML = `<div class="disk-head"><span><b>${th.files.length}</b> file${th.files.length > 1 ? "s" : ""}</span><span class="mono">${esc(th.dir || "tools/")}</span></div><ul class="tree">${th.files.map(([p, note, size]) =>
      `<li><button class="row" data-tfile="${esc(p)}" ${st.item === p ? 'aria-current="true"' : ""}><span class="ic">${icon(th.dir ? "driver" : "tool")}</span><span class="nm">${esc(p.split("/").pop())}</span><span class="desc">${esc(note)}</span><span class="size">${kb(size)}</span></button></li>`).join("")}</ul>`;

}

// --- the info window -------------------------------------------------------------------
function siblingsInOtherSizes(d) {
  const s = set[d.set];
  if (s.group === "progs") return s.disks.map(id => disk[id]).filter(x => x.id !== d.id);
  return D.disks.filter(x => x.id !== d.id && x.role === d.role && x.group === d.group && x.geo !== d.geo);
}
function diskChip(x, label) { return `<button class="chip" data-go="${x.geo}|${x.id}">${esc(label || geoLabel[x.geo])}<small>${esc(x.file)}</small></button>`; }
function drawDiskInfo(d) {
  const s = set[d.set];
  const progs = (d.tree || []).filter(([p]) => /\.(O88|WAB)$/.test(p)).sort((a, b) => info(baseName(a[0])).title.localeCompare(info(baseName(b[0])).title));
  const pair = s.disks.map(id => disk[id]).filter(x => x.id !== d.id && x.geo === d.geo);
  const other = siblingsInOtherSizes(d);
  let h = `<div class="ident"><span class="ic">${icon(d.file.endsWith(".iso") ? "cd" : "disk", 30)}</span><h2>${esc(d.role)}</h2><span class="fn">${esc(d.file)} · ${esc(geoLabel[d.geo])}</span></div>
    <p class="lede">${esc(D.blurbs[d.role] || D.blurbs[s.title] || s.desc)}</p><dl class="facts">`;
  const g = D.geos.find(x => x.key === d.geo);

  if (d.built && d.clusters) h += `<dt>Space</dt><dd>${kb((d.clusters - d.free) * d.csize)} used, ${kb(d.free * d.csize)} free (${(d.clusters - d.free).toLocaleString()} of ${d.clusters.toLocaleString()} clusters)</dd>`;
  if (pair.length) h += `<dt>${s.group === "viddemo" ? "Other adapters" : "Goes with"}</dt><dd><div class="chips">${pair.map(x => diskChip(x, x.role)).join("")}</div></dd>`;
  if (other.length) h += `<dt>Other sizes</dt><dd><div class="chips">${other.map(x => diskChip(x)).join("")}</div></dd>`;
  h += `</dl>`;
  const slug = (t, cut) => (cut ? t.replace(/,.*$/, "") : t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const page = D.diskpages[slug(d.role)] || D.diskpages[slug(d.role, 1)] || D.diskpages[slug(s.title, 1)];
  if (page) h += `<div class="manual">${page}</div>`;
  if (progs.length) {
    h += `<div class="eyebrow">Programs on this disk</div><ul class="prog-list">${progs.map(([p]) => { const n = baseName(p), i = info(n);
      return `<li><button data-path="${esc(p)}"><span>${esc(i.title)}</span><span class="mono">${esc(n)}</span></button></li>`; }).join("")}</ul>`;
  }

}
function drawItemInfo(d, path) {

  const size = row[1];
  const seen = (where[n] || []).map(([id]) => disk[id]);
  const byGeo = {};
  seen.forEach(x => { (byGeo[x.geo] ||= []).push(x); });
  const others = seen.filter(x => x.id !== d.id), geos = D.geos.filter(g => (byGeo[g.key] || []).some(x => x.id !== d.id));

  const ti = d.texts && d.texts[path];

  if (ti != null) h += `<div class="eyebrow">What this file says${d.texts && seen.length > 1 ? " (on " + esc(d.file) + ")" : ""}</div><pre class="filetext">${esc(D.texts[ti])}</pre>`;

function drawThingInfo(th) {

// --- events ---------------------------------------------------------------------
function openViewer(btn) {
  const img = btn.querySelector("img"), v = document.getElementById("viewer"), vi = document.getElementById("viewerImg");
  vi.src = btn.dataset.zoom; vi.alt = img.alt;
  // Integer scale only: pixel art blurs at anything else.
  const k = Math.max(1, Math.floor(Math.min((innerWidth - 40) / img.naturalWidth, (innerHeight - 120) / img.naturalHeight)));
  vi.style.width = img.naturalWidth * k + "px";
  document.getElementById("viewerCap").textContent = img.alt;
  v.hidden = false; document.getElementById("viewerClose").focus();
}
function closeViewer() { document.getElementById("viewer").hidden = true; }
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]"); if (z) return openViewer(z);
  if (e.target.closest("#viewer")) return closeViewer();
  if (e.target.closest("[data-also]")) { st.alsoOpen = !st.alsoOpen; const r = document.getElementById("right"), y = r.scrollTop; drawRight(); r.scrollTop = y; return; }
  const sec = e.target.closest("[data-sec]");
  if (sec) { const k = sec.dataset.sec; st.secOpen[k] = !(st.secOpen[k] ?? disk[st.disk]?.section === k); return drawShelf(); }
  const tab = e.target.closest("[data-geo]"); if (tab) { st.secOpen = {}; return go(tab.dataset.geo); }
  const dk = e.target.closest("[data-disk]"); if (dk) return go(st.geo, dk.dataset.disk);
  const g = e.target.closest("[data-go]"); if (g) { const [geo, id] = g.dataset.go.split("|"); return go(geo, id, st.item && disk[id] && (disk[id].tree || []).some(([p]) => p === st.item) ? st.item : findPath(id, st.item)); }
  const tf = e.target.closest("[data-tfile]"); if (tf) return go(st.geo, st.disk, tf.dataset.tfile);
  const it = e.target.closest("a[data-item]"); if (it) { e.preventDefault(); return openName(it.dataset.item); }
  const r = e.target.closest("[data-path]");
  if (r) {
    const p = r.dataset.path;
    if (p.endsWith("/") && r.classList.contains("row")) { const key = st.disk + ":" + p; st.open[key] = r.getAttribute("aria-expanded") !== "true"; }
    return go(st.geo, st.disk, p);
  }
});
function findPath(diskId, item) {
  if (!item) return null;
  const n = baseName(item), d = disk[diskId];
  const hit = d && (d.tree || []).find(([p]) => baseName(p) === n);
  return hit ? hit[0] : null;
}
function openName(n) {
  const hits = where[n] || where[n + "/"] || [];
  if (!hits.length) return;
  const here = hits.find(([id]) => disk[id].geo === st.geo && disk[id].section === "main") || hits.find(([id]) => disk[id].geo === st.geo) ||
    hits.find(([id]) => disk[id].section === "main") || hits[0];
  go(disk[here[0]].geo, here[0], here[1]);
}

// --- search ------------------------------------------------------------------------
const IDX = [];
D.disks.forEach(d => IDX.push({ k: "Disk", ic: d.file.endsWith(".iso") ? "cd" : "disk", t: d.role, sub: `${d.file} · ${geoLabel[d.geo]}`, txt: `${d.role} ${d.file} ${set[d.set].title} ${geoLabel[d.geo]}`, run: () => go(d.geo, d.id) }));
Object.keys(where).forEach(n => { const i = info(n); IDX.push({ k: i.kind === "program" ? "Program" : i.kind === "folder" ? "Folder" : "File", ic: i.kind, t: i.title, sub: n, txt: `${n} ${i.title} ${i.summary}`, run: () => openName(n), boost: i.kind === "program" ? 2 : i.described ? 1 : 0 }); });
[...D.tools, ...D.firmware].forEach(t => IDX.push({ k: D.tools.includes(t) ? "Tool" : "Firmware", ic: t.dir ? "driver" : "tool", t: t.title, sub: t.files.map(f => f[0].split("/").pop()).join(", "), txt: `${t.title} ${t.summary} ${t.files.map(f => f[0]).join(" ")}`, run: () => go(D.tools.includes(t) ? "tools" : "firmware", t.id), boost: 2 }));
const q = document.getElementById("q"), res = document.getElementById("results");
let hits = [], sel = 0;
function score(e, words) {
  const t = e.t.toLowerCase(), s = e.sub.toLowerCase(), x = e.txt.toLowerCase();
  let sc = 0;
  for (const w of words) {
    if (t.startsWith(w) || s.startsWith(w)) sc += 6; else if (t.includes(w) || s.includes(w)) sc += 4; else if (x.includes(w)) sc += 1; else return 0;
  }
  return sc + (e.boost || 0);
}
function search() {
  const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { res.hidden = true; return; }
  hits = IDX.map(e => [score(e, words), e]).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).slice(0, 14).map(x => x[1]);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((e, i) => `<button role="option" aria-selected="${i === sel}" data-hit="${i}">${icon(e.ic)}<span class="r-title"><b>${esc(e.t)}</b><small>${esc(e.sub)}</small></span><span class="r-kind">${e.k}</span></button>`).join("")
    : `<div class="empty">Nothing matches “${esc(q.value)}”.</div>`;
  res.hidden = false;
}
function pick(i) { const e = hits[i]; if (!e) return; res.hidden = true; q.blur(); e.run(); }
q.addEventListener("input", search);
q.addEventListener("focus", search);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(hits.length, 1); [...res.querySelectorAll("[data-hit]")].forEach((b, i) => b.setAttribute("aria-selected", i === sel)); }
  else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
  else if (e.key === "Escape") { res.hidden = true; q.blur(); }
});
res.addEventListener("mousedown", e => { const b = e.target.closest("[data-hit]"); if (b) { e.preventDefault(); pick(+b.dataset.hit); } });
q.addEventListener("blur", () => setTimeout(() => { res.hidden = true; }, 120));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("viewer").hidden) return closeViewer();
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

// --- start -----------------------------------------------------------------------------
(function start() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) {
    const [id, item] = h.split("~");
    if (disk[id]) return go(disk[id].geo, id, item ? findPath(id, item) || (item + "/") : null, false);
    if (things[id]) return go(D.tools.includes(things[id]) ? "tools" : "firmware", id, null, false);
  }
  go(st.geo, null, null, false);
})();
</script>
